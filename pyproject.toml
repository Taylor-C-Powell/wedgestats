[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wedgestats"
version = "1.0.0"
description = "A comprehensive statistical library for distributions, descriptive statistics, hypothesis testing, and regression."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Taylor C. Powell" },
]
keywords = ["statistics", "distributions", "hypothesis-testing", "regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "scipy>=1.11",
    "numpy>=1.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build",
]

[tool.setuptools.packages.find]
include = ["wedgestats*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
