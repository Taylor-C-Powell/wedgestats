[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wedgestats"
version = "1.0.0"
description = "A statistical library (wedgestats) and an interactive formula workbench (wedgelab) for building publication-quality diagnostic figures."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Taylor C. Powell" },
]
keywords = [
    "statistics",
    "distributions",
    "hypothesis-testing",
    "regression",
    "qq-plot",
    "publication-figures",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "scipy>=1.11",
    "numpy>=1.25",
]

[project.optional-dependencies]
# The workbench GUI and figure rendering.  wedgestats itself stays free of
# these, so the library remains importable in a headless environment.
lab = [
    "matplotlib>=3.8",
    "sympy>=1.12",
]
dev = [
    "pytest>=7.0",
    "build",
    "matplotlib>=3.8",
    "sympy>=1.12",
]

[project.scripts]
wedgelab = "wedgelab.__main__:main"

[tool.setuptools.packages.find]
include = ["wedgestats*", "wedgelab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
